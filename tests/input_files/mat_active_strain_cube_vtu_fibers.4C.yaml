DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    ENTITY_TYPE: node_set_id
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    ENTITY_TYPE: node_set_id
    NUMDOF: 3
    ONOFF: [0, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 3
    ENTITY_TYPE: node_set_id
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
STRUCTURE GEOMETRY:
  FILE: vtu/mat_active_strain_cube.vtu
  SHOW_INFO: "summary"
  ELEMENT_BLOCKS:
    - ID: 1
      SOLID:
        HEX8:
          MAT: 1
          KINEM: nonlinear
fields:
  - name: fiber1
    discretization: "structure"
    source:
      from_mesh:
        basis: "cells"
  - name: fiber2
    discretization: "structure"
    source:
      from_mesh:
        basis: "cells"
